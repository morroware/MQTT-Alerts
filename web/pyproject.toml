[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mqtt-alerts-web"
version = "1.0.0"
description = "Web UI and API for MQTT Alerts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "paho-mqtt>=2.0,<3.0",
    "slack-sdk>=3.27,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.setuptools.packages.find]
include = ["mqtt_alerts_web*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
