# MQTT-Alerts Mosquitto Configuration
# Raspberry Pi 5 - Bookworm 64-bit

# =============================================================================
# Listeners
# =============================================================================

# Listen on all interfaces for local network access
listener 1883 0.0.0.0

# WebSocket listener for browser-based MQTT clients
listener 9001 0.0.0.0
protocol websockets

# =============================================================================
# Security
# =============================================================================

# Allow anonymous connections by default (change to false for production)
allow_anonymous true

# Optional: password file (uncomment and run mosquitto_passwd to set up)
# password_file /etc/mosquitto/passwd

# Optional: access control list
# acl_file /etc/mosquitto/acl.conf

# =============================================================================
# Persistence
# =============================================================================

persistence true
persistence_location /var/lib/mosquitto/

# =============================================================================
# Logging
# =============================================================================

log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# =============================================================================
# Performance
# =============================================================================

# Max inflight messages
max_inflight_messages 20

# Max queued messages
max_queued_messages 1000

# Message size limit (256KB)
message_size_limit 262144

# =============================================================================
# Connection settings
# =============================================================================

# Max keepalive interval — PLCs (AutomationDirect BRX, Productivity, etc.)
# often use longer keepalive values (up to 300s). Setting to 0 disables
# the server-side override and accepts any client keepalive value.
max_keepalive 0
