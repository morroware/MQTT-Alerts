# MQTT-Alerts Access Control List
# Uncomment and modify as needed
#
# Pattern-based ACLs:
#   pattern read  sensors/%u/#
#   pattern write sensors/%u/#
#
# User-specific ACLs:
#   user admin
#   topic readwrite #
#
#   user monitor
#   topic read #
#
# Anonymous access (when allow_anonymous is true):
# topic read $SYS/#
# topic readwrite #
